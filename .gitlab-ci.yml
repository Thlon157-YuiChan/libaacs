stages:
    - build

variables:
    GIT_SUBMODULE_STRATEGY: normal

build-debian:
    image: registry.videolan.org/vlc-debian-unstable:20200529132440
    stage: build
    tags:
        - docker
        - amd64
    script:
        - ./bootstrap
        - mkdir build
        - cd build
        - ../configure
        - make -j $(getconf _NPROCESSORS_ONLN)

build-macos:
    stage: build
    tags:
        - amd64
        - macos
    script:
        - CONTRIB_TARBALL=`curl -s https://artifacts.videolan.org/vlc/macos-x86_64/SHA512SUM 2>/dev/null | cut -d '/' -f 2`
        - curl -sS -O https://artifacts.videolan.org/vlc/macos-x86_64/$CONTRIB_TARBALL
        - tar xf "$CONTRIB_TARBALL"
        - cd x86_64-apple-darwin19
        - curl -sS -o ./change_prefix.sh 'https://code.videolan.org/videolan/vlc/-/raw/master/contrib/src/change_prefix.sh'
        - chmod +x ./change_prefix.sh
        - ./change_prefix.sh
        - export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:`pwd -P`/lib/pkgconfig/"
        - export PATH="$PATH:`pwd -P`/bin/"
        - cd ../
        - ./bootstrap
        - mkdir build
        - cd build
        - ../configure
        - make -j $(getconf _NPROCESSORS_ONLN)
        - make install DESTDIR=`pwd`/artifacts
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
        paths:
            - build/artifacts/
        expire_in: 1 week

.build-win-template:
    image: registry.videolan.org/vlc-debian-win64:20240122094311
    stage: build
    tags:
        - docker
        - amd64
    variables:
        GPG_ERROR_VER: "1.61"
        GCRYPT_VER: "1.12.2"
    script:
        - mkdir sysroot
        - export PREFIX=`realpath sysroot`
        - export HOST="$TARGET_HOST"
        #
        - curl -LO https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-${GPG_ERROR_VER}.tar.bz2
        - tar xjf libgpg-error-${GPG_ERROR_VER}.tar.bz2
        - cd libgpg-error-${GPG_ERROR_VER}
        - ./configure --host="$HOST" --prefix="$PREFIX" --disable-doc --enable-static --disable-shared
        - make -j $(getconf _NPROCESSORS_ONLN)
        - make install
        - cd ..
        #
        - curl -LO https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-${GCRYPT_VER}.tar.bz2
        - tar xjf libgcrypt-${GCRYPT_VER}.tar.bz2
        - ls
        - cd libgcrypt-${GCRYPT_VER}
        - ./configure --host="$HOST" --prefix="$PREFIX" --disable-doc --enable-static --disable-shared
        - make -j $(getconf _NPROCESSORS_ONLN)
        - make install
        - cd ..
        #
        - export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:`realpath sysroot`/lib/pkgconfig/"
        - export PATH="$PATH:`realpath sysroot`/bin/"
        - ./bootstrap
        - mkdir build
        - cd build
        - ../configure --host="$HOST" LIBS="-lws2_32"
        - make -j $(getconf _NPROCESSORS_ONLN)
        - make install DESTDIR=`pwd`/artifacts
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
        paths:
            - build/artifacts/
        expire_in: 1 week

build-win64:
    extends: .build-win-template
    variables:
        TARGET_HOST: "x86_64-w64-mingw32"

build-win32:
    extends: .build-win-template
    variables:
        TARGET_HOST: "i686-w64-mingw32"
